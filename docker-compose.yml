services:

  backend:
    build: ./Server
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - sqlserver

  frontend:
    image: react:latest
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Sakshi@mssql"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: